<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAILWIND-MD01-AL-011</title>
    <!-- importanto biblioteca -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- definindo tamanho por pixel -->
    <div class="bg-blue-600 w-24 h-24">DIV UM</div>

    <!-- definindo tamanho por fração -->
    <div class="bg-red-600 w-1/2 h-24">DIV DOIS</div>

    <!-- definindo tamanho ou largura (full) 100% disponivel -->
    <div class="bg-green-600 w-full h-24">DIV TRES</div>

    <!-- definindo tamanho ou largura (screen) 100vh ou o que estiver disponivel -->
    <div class="bg-yellow-600 w-1/10 h-screen">DIV QUATRO</div>

    <!-- definindo tamanho max de tela para dispositivos moveis -->
    <div class="bg-gray-600 max-w-sm">DIV CINCO</div>
</body>
</html>
